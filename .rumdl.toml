# rumdl configuration file

# Global configuration options
[global]
# List of rules to disable (uncomment and modify as needed)
disable = [
  "MD012",
  "MD013",
  "MD022",
  "MD033",
  "MD063",
  "blanks-around-lists",
  "first-line-h1",
]
line-length = 100
cache = false

[ul-style]
style = "dash"  # gh default & quicker to type

[ul-indent]
indent = 4  # consistent with .editorconfig

[line-length]
code-blocks = false
reflow = true  # enable auto-formatting

[blanks-around-headings]
lines-below = 0  # rule of proximity

[ol-prefix]
style = "ordered"

[no-inline-html]
allowed-elements = ["a", "img"]

[emphasis-style]
style = "asterisk"  # better thna underscore, since not considered a word-char

[strong-style]
style = "asterisk"

[table-format]
enabled = true  # opt-in rule

[heading-capitalization]
enabled = false  # opt-in rule
style = "sentence_case"
ignore-words = ["nvim", "vscode"]

[frontmatter-key-sort]
enabled = false  # opt-in rule

[toc-validation]
enabled = false  # opt-in rule

# List of rules to enable exclusively (if provided, only these rules will run)
# enable = ["MD001", "MD003", "MD004"]

# List of file/directory patterns to include for linting (if provided, only these will be linted)
include = ["docs/*.md", "src/**/*.md", "README.md", "./julia_notes/stats/*.qmd"]

# List of file/directory patterns to exclude from linting
exclude = [
  # Common directories to exclude
  ".git",
  ".github",
  ".jj",
  ".quarto",
  ".vscode",
  ".*_cache",
  "_extensions/**",
  "_output/**",
  "node_modules",
  "vendor/",
  "dist",
  "build/**",
  "docs/generated/**",

  # Specific files or patterns
  "CHANGELOG.md",
  "LICENSE.md",
]

# Respect .gitignore files when scanning directories (default: true)
# respect_gitignore=false

# Markdown flavor/dialect (uncomment to enable)
# Options: mkdocs, gfm, commonmark
flavor = "quarto"

# Rule-specific configurations (uncomment and modify as needed)

# [MD003]
# style = "atx"  # Heading style (atx, atx_closed, setext)

[MD004]
style = "dash"  # Unordered list style (asterisk, plus, dash, consistent)

[MD007]
indent = 4  # Unordered list indentation

[MD013]
line-length = 100  # Line length
code-blocks = true  # Exclude code blocks from line length check
tables = true  # Exclude tables from line length check
headings = true  # Include headings in line length check

[MD044]
names = [
  "rumdl",
  "Markdown",
  "GitHub"
]  # Proper names that should be capitalized correctly
code-blocks = false  # Check code blocks for proper names (default: false, skips code blocks)

# ------------------------------------------------------------------------------

# DOCS https://rumdl.dev/code-block-tools/
[code-block-tools]
enabled = true
on-missing-language-definition = "fail"
timeout = 10000  # 10s

[code-block-tools.languages.python]
enabled = true
lint = ["ruff:check"]

[code-block-tools.tools.runic_formatter]
command = [
  # "jlfmt",
  # "--style=sciml",
  # "-i",
  # "--format_mardown",
  "runic",
  "--extensions=jl,qmd,md",
  "-i",
  "-"
]
stdin = true
stdout = true
# "--prioritize-config-file"

[code-block-tools.languages]
python = { lint = ["ruff:check"], format = ["ruff:format"] }
shell = { lint = ["shellcheck"], format = ["shfmt"], on-error = "skip" }
lua = { format = ["stylua"] }
toml = { lint = ["tombi:lint"], format = ["tombi:format"] }
yaml = { format = ["yamlfmt"] }
markdown = { format = ["rumdl"] }
# quarto = { format = ["rumdl", "jlfmt_fmt"], on-error = "skip" }
quarto = { format = ["rumdl"], on-error = "fail" }
json = { lint = ["jq"], format = ["oxfmt"] }
sql = { format = ["sql-formatter"], on-error = "skip" }
julia = { format = ["runic_formatter"], on-error = "fail" }
# plaintext = { format = ["latexindent"] }
plaintext = { enabled = false }
text = { enabled = false }
